<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorful Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<section class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white p-16">
  <h1 class="text-5xl font-bold">Colorful DevOps Dashboard</h1>
  <p class="mt-4 text-xl">Frontend-only app built with HTML + Tailwind CSS.</p>
</section>

<div class="max-w-6xl mx-auto p-8 grid md:grid-cols-3 gap-6">
  <div class="bg-blue-500 text-white p-6 rounded-3xl shadow-xl">Docker</div>
  <div class="bg-purple-500 text-white p-6 rounded-3xl shadow-xl">Jenkins</div>
  <div class="bg-pink-500 text-white p-6 rounded-3xl shadow-xl">Kubernetes</div>
</div>

<div class="max-w-6xl mx-auto p-8">
  <h2 class="text-3xl font-bold mb-4">Learning Modules</h2>
  <div class="flex gap-4 overflow-x-auto">
    <div class="min-w-[250px] bg-green-500 text-white p-6 rounded-2xl">AWS</div>
    <div class="min-w-[250px] bg-orange-500 text-white p-6 rounded-2xl">Terraform</div>
    <div class="min-w-[250px] bg-indigo-500 text-white p-6 rounded-2xl">CI/CD</div>
  </div>
</div>
</body>
</html>
